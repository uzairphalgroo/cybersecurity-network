<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep Obsidian Cyber Canvas Backdrop -->
  <rect width="1200" height="630" fill="#000000"/>
  
  <!-- Subtle Monochromatic Perspective Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowCyan" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>
  <rect width="1200" height="630" fill="url(#glowPurple)"/>

  <!-- Left Side: Grand Holographic Shield Sentinel Emblem -->
  <g transform="translate(120, 165) scale(3.0)">
    <!-- Base Plate -->
    <path d="M 50 6 L 88 20 L 88 52 C 88 77 50 94 50 94 C 50 94 12 77 12 52 L 12 20 Z" fill="#090D16" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Security Mesh -->
    <path d="M 50 14 L 80 25 L 80 50 C 80 70 50 86 50 86 C 50 86 20 70 20 50 L 20 25 Z" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
    <!-- Sentinel Ears -->
    <path d="M 28 18 L 43 32 L 28 37 Z" fill="#E2E8F0" stroke="#FFFFFF" stroke-width="0.8"/>
    <path d="M 72 18 L 72 37 L 57 32 Z" fill="#E2E8F0" stroke="#FFFFFF" stroke-width="0.8"/>
    <!-- Forehead -->
    <path d="M 50 20 L 64 34 L 50 44 L 36 34 Z" fill="#0F172A" stroke="#E2E8F0" stroke-width="1.2"/>
    <!-- Cyber Snout -->
    <path d="M 40 56 L 50 46 L 60 56 L 55 68 L 45 68 Z" fill="#05070E" stroke="#38BDF8" stroke-width="1.2"/>
    <!-- Lower Jaw -->
    <path d="M 33 60 L 50 80 L 67 60 L 59 66 L 50 74 L 41 66 Z" fill="#E2E8F0" stroke="#FFFFFF" stroke-width="1"/>
    <!-- Ocular Core -->
    <polygon points="50,38 57,45 50,52 43,45" fill="#EC4899"/>
    <circle cx="50" cy="45" r="3.5" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1.2"/>
  </g>

  <!-- Right Side: Prestigious Typographic Lockup & Feature Pills -->
  <g transform="translate(480, 160)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="340" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <circle cx="20" cy="17" r="4" fill="#34D399"/>
    <text x="36" y="22" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="2">AUTONOMOUS CSPM &amp; GRAPH ENGINE</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#FFFFFF" font-family="'Orbitron', sans-serif" font-size="64" font-weight="900" letter-spacing="6">AUDITHOUND</text>

    <!-- Subtitle -->
    <text x="0" y="145" fill="#94A3B8" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="500" letter-spacing="1">
      Next-Gen Cloud Security Posture &amp; Zero-Touch Remediation
    </text>

    <!-- Feature Grid Badges -->
    <g transform="translate(0, 190)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="280" height="42" rx="12" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.4)"/>
      <text x="20" y="26" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">🕸️ Multi-Hop Attack Graphs</text>

      <!-- Pill 2 -->
      <rect x="300" y="0" width="310" height="42" rx="12" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.4)"/>
      <text x="320" y="26" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">🤖 Autonomous AI Purple-Team</text>

      <!-- Pill 3 -->
      <rect x="0" y="56" width="280" height="42" rx="12" fill="rgba(52, 211, 153, 0.12)" stroke="rgba(52, 211, 153, 0.4)"/>
      <text x="20" y="82" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">⚡ 1-Click Terraform Patches</text>

      <!-- Pill 4 -->
      <rect x="300" y="56" width="310" height="42" rx="12" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.4)"/>
      <text x="320" y="82" fill="#FDA4AF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">📡 eBPF Kernel Packet Telemetry</text>
    </g>

    <!-- Footer Trust Bar -->
    <text x="0" y="340" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" letter-spacing="1.5">
      SOC 2 TYPE II &bull; CIS BENCHMARKS &bull; MITRE ATT&amp;CK &bull; TERRAFORM AUTOPILOT
    </text>
  </g>
</svg>
